      position_meters: 45.0
      timestamp: "2026-05-23T10:30:00+00:00"
      source: "simulator"
    user_roles: ["technician"]
seed:
  qdrant_chunks: []
  neo4j_facts: []
  tsdb_rows: []
  audit_seed: []
mock_llm_fixture: tests/fixtures/llm_responses/quality-inspector/degraded.jsonl
expected:
  decision: auto  # fallback verdict still routes to supervisor (hitl_supervisor on resume)
  action_type: QUALITY_VERDICT
  tool_calls: []
  audit_rows: 0  # supervisor branch ⇒ pending in hitl.approvals, audit only on resume
