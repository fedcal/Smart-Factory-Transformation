- term: anomaly_detection
  definition: "Automated identification of abnormal patterns in sensor data (vibration, temperature, current) relative to a baseline; foundation of ops-monitoring agents."
  category: agentic-platform
  related_terms: [predictive_maintenance, agent_node, opc_ua, time_series]
  examples:
    - "Isolation forest-based anomaly_detection detects vibration anomalies with precision 0.92 on simulated data."
