- term: predictive_maintenance
  definition: "Maintenance approach that uses sensor data and predictive models (time-series, anomaly detection) to estimate the remaining useful life of a component and schedule intervention before failure."
  category: agentic-platform
  related_terms: [mtbf, mttr, oee, anomaly_detection]
  examples:
    - "Predictive maintenance on spindles reduces unplanned stops by 30 percent compared with calendar-based preventive maintenance."
