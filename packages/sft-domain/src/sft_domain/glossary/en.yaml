# REGULATORY (~2 terms)
# ─────────────────────────────────────────────────────────────────────────────

- term: gdpr
  definition: "General Data Protection Regulation (EU 2016/679) — European data protection framework; imposes audit trail, data minimisation, and right-to-explanation requirements relevant to the agentic platform's automated decisions."
  category: regulatory
  related_terms: [audit_trail, hitl, data_retention]
  examples:
    - "The HITL audit trail must be retained for the period established by GDPR and applicable Italian law."
  source: iso-standard

- term: eu_ai_act
  definition: "European Union Artificial Intelligence Act (2024); classifies AI systems by risk level and imposes transparency, audit, and human oversight obligations for high-risk systems."
  category: regulatory
  related_terms: [hitl, audit_trail, gdpr]
  examples:
    - "AI-based maintenance decision-support systems may fall under the AI Act high-risk category."
  source: industry-standard
