- term: vector_store
  definition: "Specialised database for storing and searching high-dimensional vectors (embeddings); supports ANN (approximate nearest neighbour) operations with metadata filtering."
  category: agentic-platform
  related_terms: [qdrant, embedding, retrieval, bge_m3]
  examples:
    - "The Qdrant vector_store indexes 20,000 SOP chunks with BGE-M3 1024-dimension embeddings."
  source: agentic-community

- term: state_persistence
  definition: "Mechanism by which an agent graph state is durably saved to a backend (Postgres, SQLite) through the LangGraph checkpointer, enabling restore and replay."
  category: agentic-platform
  related_terms: [langgraph_checkpoint, agent_state, langgraph]
  examples:
    - "State persistence on Postgres guarantees agent session recovery after a service restart."
  source: agentic-community

- term: tracing
  definition: "Systematic collection of spans and traces of all LLM calls, tool calls, and agent nodes, with latencies, token counts, inputs and outputs; foundation of agentic system quality monitoring."
  category: agentic-platform
  related_terms: [langfuse, audit_trail]
  examples:
    - "Langfuse tracing records every LLM call with p95 latency, token_usage, and session_id."
  source: agentic-community

- term: fine_tuning
  definition: "Adapting a pre-trained LLM on a domain-specific dataset to improve performance on specialised tasks (e.g. answering SOP queries in textiles)."
  category: agentic-platform
  related_terms: [rag, qwen, llm, bge_m3]
  examples:
    - "Fine-tuning on 500 textile SOPs improves OperatorAssistant response precision by 15 percent."
  source: agentic-community

- term: llm
  definition: "Large Language Model — a large-scale language model trained on vast corpora; generates text, follows instructions, performs reasoning, and produces tool calls in agentic contexts."
  category: agentic-platform
  related_terms: [qwen, rag, tool_call, embedding]
  examples:
    - "The Qwen2.5-14B-Instruct LLM is the primary generative engine for platform agents."
  source: agentic-community

- term: knowledge_base
  definition: "Structured repository of documents (SOPs, domain pages, glossary, assumption register) indexed as vectors in a vector store; primary context source for RAG agents."
  category: agentic-platform
  related_terms: [rag, vector_store, embedding, retrieval]
  examples:
    - "The platform knowledge_base includes 20 SOPs, 20 domain pages, and 50 assumption entries."
  source: project-specific

- term: chunk
  definition: "Text fragment of optimised size (typically 256-512 tokens) obtained by segmenting a document; the fundamental unit of embedding and retrieval in the RAG system."
  category: agentic-platform
  related_terms: [embedding, retrieval, rag, knowledge_base]
  examples:
    - "Each SOP is segmented into 400-token chunks with 50-token overlap for coherent retrieval."
  source: agentic-community

- term: inference_latency
  definition: "LLM response time from prompt submission to receiving the first token (time-to-first-token, TTFT) or the full response; a critical KPI for operator interface usability."
  category: agentic-platform
  related_terms: [llm, qwen, ollama]
  examples:
    - "Qwen2.5-14B TTFT inference latency on an A10G GPU is < 0.8 s for 512-token prompts."
