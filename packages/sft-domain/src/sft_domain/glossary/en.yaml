- term: agent_cluster
  definition: "Group of specialised agents collaborating for a specific domain (e.g. ops-cluster for operational anomalies, mnt-cluster for maintenance); each cluster has a dedicated supervisor."
  category: agentic-platform
  related_terms: [supervisor, orchestrator, agent_node]
  examples:
    - "The maintenance agent_cluster includes RCA-Specialist, Downtime-Analyzer, and Part-Recommender."
