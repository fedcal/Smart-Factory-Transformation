# --- TEXTILE-PROCESS (additional) ---

- term: ring_traveller
  definition: "Small C-shaped metal clip that runs around the ring on a ring frame; its rotation generates the yarn twist. Traveller speed determines twist level and requires regular replacement as it wears."
  category: textile-asset
  related_terms: [spindle, ring_frame, spinning, yarn_twist]
  examples:
    - "A worn ring traveller causes increased yarn breaks and is replaced every 200-300 kg of yarn produced."
  source: industry-standard

- term: drafting_cylinder
  definition: "Pair of counter-rotating rollers in the drafting zone of a ring frame or draw frame; the ratio of exit to entry surface speed defines the draft ratio."
  category: textile-asset
  related_terms: [drafting, draft_ratio, yarn_irregularity]
  examples:
    - "A drafting cylinder with eccentricity above 0.05 mm produces periodic yarn irregularities."
  source: industry-standard

- term: draft_ratio
  definition: "Ratio of the peripheral speed of the output to the input cylinders in a drafting zone; typical values 5-20x in short-staple spinning and up to 50x in open-end spinning."
  category: textile-process
  related_terms: [drafting, drafting_cylinder, yarn_irregularity]
  examples:
    - "An excessive draft ratio for the material being processed causes slubs and periodic irregularity."
  source: industry-standard

- term: four_point_system
  definition: "Standardised defect classification method (ASTM D5430) that assigns 1, 2, 3, or 4 penalty points per defect according to its length; a roll with more than 40 points per 100 m2 is downgraded."
  category: textile-process
  related_terms: [roll_inspection, inspection_table, weft_defect, warp_defect]
  examples:
    - "The four_point_system assigns 4 points to any single defect longer than 91 cm."
  source: iso-standard

- term: lot_decision
  definition: "Formal disposition — accept, conditional accept, or reject — of a fabric or yarn lot based on inspection results compared against agreed acceptance criteria (AQL, four-point system)."
  category: textile-process
  related_terms: [roll_inspection, four_point_system, aql, acceptable_quality_level]
  examples:
    - "A lot decision of 'accept' is issued when no roll exceeds 40 points/100 m2."
  source: industry-standard

- term: aql
  definition: "Acceptable Quality Level — maximum allowable defect rate in a lot for acceptance; typical value 2.5 AQL for major defects in apparel textiles, determined by sampling per ISO 2859."
  category: textile-process
  related_terms: [lot_decision, acceptable_quality_level, quality_control]
  examples:
    - "AQL 2.5 means that at most 2.5 percent of sampled pieces may have major defects."
  source: iso-standard

- term: acceptable_quality_level
  definition: "Maximum acceptable percentage of defective units in a lot according to ISO 2859 sampling plans; the extended form of AQL used in contract documentation."
  category: textile-process
  related_terms: [aql, lot_decision, quality_control]
  examples:
    - "The acceptable_quality_level agreed with the buyer is 1.5 percent for critical defects."
  source: iso-standard

- term: calendering
  definition: "Mechanical finishing treatment that passes fabric between heated high-pressure rollers to obtain gloss, surface smoothness, and thickness reduction."
  category: textile-process
  related_terms: [finishing, finishing_range, fabric_handle]
  examples:
    - "Calendering at 180 degrees Celsius gives a satin sheen to cotton/polyester fabrics."
  source: industry-standard

- term: sanforizing
  definition: "Mechanical pre-shrinking process for cotton fabric using steam pressure and a compressive felt; reduces residual wash shrinkage to less than 1 percent."
  category: textile-process
  related_terms: [finishing, finishing_range, grey_fabric]
  examples:
    - "Sanforizing is a mandatory requirement for fabrics destined for shirt manufacturing."
  source: industry-standard

- term: water_repellency
  definition: "Durable Water Repellency (DWR) finishing treatment that applies fluorocarbon or silicone to fabric to confer water resistance without closing fabric porosity."
  category: textile-process
  related_terms: [finishing, finishing_range]
  examples:
    - "C6 DWR treatment achieves a water contact angle above 120 degrees."
  source: iso-standard

- term: twisting
  definition: "Operation of plying two or more single yarns together to produce plied yarn (two-fold, three-fold) with greater strength and regularity; twist direction is S or Z."
  category: textile-process
  related_terms: [yarn_count, yarn_twist, spinning]
  examples:
    - "A Nm 40/2 two-ply yarn obtained by S-twisting two Nm 80 singles has double break strength."
  source: industry-standard

# --- TEXTILE-ASSET (additional) ---

- term: selvedge
  definition: "Reinforced lateral edge of the woven fabric, woven so as not to fray; selvedge width and structure vary from 0.5-2 cm depending on weave and loom type."
  category: textile-material
  related_terms: [loom, selvedge_defect, weaving]
  examples:
    - "A torn or loose selvedge over 50 cm causes roll downgrading."
  source: industry-standard

- term: shuttle_jam
  definition: "Sudden loom stop caused by mechanical blocking of the shuttle inside the reed or shed; requires manual intervention to remove the shuttle and restart."
  category: textile-defect
  related_terms: [loom, reed, yarn_break, heald_frame]
  examples:
    - "More than 3 shuttle jams per shift indicates reed wear or abnormal warp tension."
  source: industry-standard

- term: colour_fastness
  definition: "Resistance of dyed fabric colour to degrading agents (light, washing, rubbing, perspiration); rated on a grey scale ISO 1-5 for each agent. Minimum standard for apparel: 4-5 for washing."
  category: textile-kpi
  related_terms: [dyeing, delta_e, pilling, finishing]
  examples:
    - "Colour fastness to washing of ISO 4 is the minimum requirement for outdoor garments."
  source: iso-standard

- term: air_conditioning
  definition: "HVAC system for temperature (typically 20-24 degrees Celsius) and relative humidity (55-65 percent RH) control in spinning and weaving departments; reduces yarn breaks and static charge."
  category: textile-asset
  related_terms: [hygrometer, yarn_break, spinning]
  examples:
    - "Centralised air_conditioning maintains 60 percent relative humidity in the spinning room."
  source: industry-standard

- term: stenter
  definition: "Finishing machine that stretches fabric to width on lateral tenter chains with clips while passing through a heated chamber; stabilises dimensions and cures finishing resins."
  category: textile-asset
  related_terms: [finishing, finishing_range, sanforizing]
  examples:
    - "An 8-chamber gas stenter stabilises fabric width to ±1 mm at 60 m/min."
  source: industry-standard

- term: lightbox_table
  definition: "Back-lit inspection table for visual examination of thin fabrics (silk, voile, chiffon); reveals transparency defects, holes, and double picks not visible under reflected light."
  category: textile-tool-ppe
  related_terms: [inspection_table, roll_inspection, weft_defect]
  examples:
    - "A lightbox table is essential for inspecting 30 g/m2 georgette fabrics."
  source: industry-standard

- term: thread_counter
  definition: "Magnifying lens with a graduated reticle (typically 10x, 1 cm2 area) used to count warp and weft threads per centimetre in finished fabric."
  category: textile-tool-ppe
  related_terms: [pick density, pick_counter, yarn_count]
  examples:
    - "A Peak 2001-25x thread_counter measures weft density up to 60 threads/cm."
  source: industry-standard

# --- TEXTILE-MATERIAL (additional) ---

- term: roving
  definition: "Intermediate product in spinning: a partially twisted and elongated sliver of fibres with typical count Nm 0.4-1.5, feeding the ring frame for the final drafting and twisting stage."
  category: textile-material
  related_terms: [spinning, ring_frame, drafting, yarn_count]
  examples:
    - "Over-twisted roving impedes drafting and causes count irregularity in the spun yarn."
  source: industry-standard

- term: noils
  definition: "Short fibres removed during combing; they are less than 25 mm in length and cannot be spun in long-staple processes but are recovered for waste spinning or nonwovens."
  category: textile-material
  related_terms: [combing, comber, short_fibres]
  examples:
    - "Combing noils from cotton typically represent 15-20 percent of the fed fibre weight."
  source: industry-standard

- term: card_sliver
  definition: "Output from the card: a continuous untwisted assembly of opened and parallelised fibres, typically weighing 3-6 g/m, feeding draw frames or directly open-end spinners."
  category: textile-material
  related_terms: [card, carding, drafting, roving]
  examples:
    - "Card sliver with CVm% below 4 percent guarantees acceptable yarn quality downstream."
  source: industry-standard

- term: liquor_ratio
  definition: "Ratio of fabric weight to dye bath volume during dyeing, expressed as 1:N (e.g. 1:8 = 1 kg fabric per 8 litres of liquor); influences dyeing uniformity and water consumption."
  category: textile-material
  related_terms: [dye_bath, dyeing, jet_dyeing]
  examples:
    - "Modern jet dyeing technology reduces liquor ratio to 1:3, cutting water consumption by 50 percent."
  source: industry-standard

- term: cotton_fibre
  definition: "Natural cellulosic fibre extracted from the cotton boll (Gossypium spp.); typical staple length 22-38 mm, fineness 1.3-2.0 dtex; the basis of short-staple spinning."
  category: textile-material
  related_terms: [carding, combing, yarn_count, card_sliver]
  examples:
    - "Pima cotton with 35 mm staple produces high-quality combed yarns at Nm 80-120."
  source: industry-standard

- term: reactive_dye
  definition: "Class of synthetic dyes that form covalent bonds with cotton cellulose in an alkaline hot environment; high fastness but require extensive washing to remove hydrolysed dye."
  category: textile-material
  related_terms: [dyeing, dye_bath, colour_fastness, jet_dyeing]
  examples:
    - "Bifunctional reactive dyes achieve wash fastness 4-5 on cotton."
  source: iso-standard

- term: chemical_auxiliary
  definition: "Chemical product added to a dye bath or finishing process to improve performance; includes levelling agents, softeners, surfactants, sequestrants, and antioxidants."
  category: textile-material
  related_terms: [dyeing, dye_bath, finishing]
  examples:
    - "An ionic levelling agent added to the bath reduces unlevelness caused by irregular dye adsorption."
  source: industry-standard

- term: warp_tension
  definition: "Pulling force exerted by the warp beam brake on warp threads during weaving, expressed in Newtons per thread or total Newtons on the beam; typical 10-30 N for cotton Nm 40."
  category: textile-kpi
  related_terms: [warp_beam, loom, warp_tension_sensor, yarn_break]
  examples:
    - "Warp tension below 8 N causes missing picks; above 35 N it increases yarn breaks."
  source: industry-standard

- term: loom_efficiency
  definition: "Percentage of productive time versus total available time for a loom; calculated as (actual picks / programmed picks) x 100; includes losses from stops, beam changes, and adjustments."
  category: textile-kpi
  related_terms: [oee, mtbf, mttr, yarn_break, downtime]
  examples:
    - "Loom efficiency of 92 percent on a modern rapier is considered excellent."
  source: industry-standard

- term: spinning_productivity
  definition: "Quantity of yarn produced per unit time and machine, expressed in kg/h/machine or g/spindle/hour; depends on count, twist, spindle speed, and break frequency."
  category: textile-kpi
  related_terms: [spinning, oee, yarn_break, yarn_count]
  examples:
    - "Spinning productivity on a ring frame drops 15 percent when the break rate exceeds 10/h/m."
  source: industry-standard

- term: downtime
  definition: "Periods of machine inactivity, classified as planned (beam change, scheduled maintenance) or unplanned (breakdowns, breaks, emergency adjustments); feeds OEE calculation."
  category: textile-kpi
  related_terms: [oee, mtbf, mttr, loom_efficiency]
  examples:
    - "Unplanned downtime exceeding 5 percent of the shift triggers escalation to the shift supervisor."
  source: industry-standard

- term: energy_consumption
  definition: "Electrical energy consumed by a textile machine per unit of production, expressed in kWh/kg or kWh/m2; a key KPI for sustainability and production cost management."
  category: textile-kpi
  related_terms: [oee, spinning_productivity, loom_efficiency]
  examples:
    - "A modern jet dyeing machine consumes 1.2 kWh/kg of dyed fabric against 2.0 kWh/kg for older systems."
  source: industry-standard

# --- AGENTIC-PLATFORM (additional) ---

- term: orchestrator
  definition: "Central platform component that manages agent session lifecycle: starts LangGraph graphs, routes events, manages the HITL queue, and persists state on Postgres."
