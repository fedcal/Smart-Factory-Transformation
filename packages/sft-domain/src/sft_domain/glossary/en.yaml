- term: yarn_break_rate
  definition: "Average number of warp or weft thread breaks per 1000 m of yarn produced or per hour per machine; critical KPI for spinning and weaving, feeds the OEE model."
  category: textile-kpi
  related_terms: [yarn_break, oee, loom_efficiency, mtbf]
  examples:
    - "A yarn break rate above 5 breaks/h/loom triggers a root cause analysis."
  source: industry-standard

- term: defect_report
  definition: "Document or digital screen recording the position, type, and size of each defect detected during roll inspection; attached to the lot quality certificate."
  category: textile-process
  related_terms: [roll_inspection, four_point_system, non_conformance]
  examples:
    - "The digital defect_report is generated automatically by camera-based inspection."
  source: industry-standard

- term: colour_tolerance
  definition: "Allowed colour variation (expressed as CMC or CIEDE2000 delta-E) within which a shade is deemed conforming to standard; typically delta-E < 1.0 for production and < 0.5 for sampling."
  category: textile-kpi
  related_terms: [delta_e, shade_deviation, colour_fastness, spectrophotometer]
  examples:
    - "The agreed CMC 0.8 colour tolerance is verified on every roll before dispatch."
  source: iso-standard

- term: fabric_handle
  definition: "Tactile perception and drape of a fabric, determined by stiffness, softness, gloss, and weight; assessed subjectively or with Kawabata/FAST instruments for technical fabrics."
  category: textile-kpi
  related_terms: [finishing, calendering, sanforizing]
  examples:
    - "A soft fabric_handle is the result of silicone softener applied in the stenter."
  source: industry-standard

- term: broken_end
  definition: "Break of a single warp thread during weaving that causes automatic loom stop; equivalent to the Italian term rottura_filo. Detected by a piezoelectric broken-end detector."
  category: textile-defect
  related_terms: [yarn_break, loom, warp_tension]
  examples:
    - "The broken_end detector on a rapier loom uses a piezoelectric sensor to detect tension drop."
  source: industry-standard
  no_direct_equivalent: false

- term: barring
  definition: "Repeated horizontal stripe at regular intervals in the fabric, caused by periodic weft tension variation or a mechanical beating defect; the EN term for the Italian 'rigatura' or 'barring effect'."
  category: textile-defect
  related_terms: [pick density, reed, loom, weft_defect]
  examples:
    - "Barring at a constant 15 cm pitch indicates a balancing problem in the beating mechanism."
  source: industry-standard
  no_direct_equivalent: false

- term: streakiness
  definition: "Non-uniform colour variation across the dyed fabric surface, visible as streaks or patches of different intensity; the EN term for the Italian 'screziatura'."
  category: textile-defect
  related_terms: [dyeing, shade_deviation, delta_e, jet_dyeing]
  examples:
    - "Streakiness from uneven dye adsorption typically manifests as vertical stripes."
  source: industry-standard
  no_direct_equivalent: false

- term: beating_mechanism
  definition: "The combined assembly of reed and sley on a loom responsible for beating each inserted weft pick against the fell of cloth; its oscillation frequency and force determine weft density and fabric compactness."
  category: textile-asset
  related_terms: [reed, loom, pick density, barring]
  examples:
    - "An anomaly in the beating_mechanism oscillation frequency causes periodic weft density variation."
  source: industry-standard

- term: heald
  definition: "Individual wire or flat-steel element with a central eye in the heald frame through which a single warp thread passes; the heald guides the thread and participates in shed formation."
  category: textile-asset
  related_terms: [heald_frame, loom, warp, weaving]
  examples:
    - "A broken heald causes the warp thread passing through it to lose tension control."
  source: industry-standard

- term: colour_matching
  definition: "Process of formulating a dye recipe that reproduces a target shade within tolerance; carried out by a colorist using spectrophotometer measurements and colour-matching software."
  category: textile-process
  related_terms: [delta_e, colour_tolerance, spectrophotometer, dyeing]
  examples:
    - "Automated colour_matching software reduces first-hit success rate to 3 trials or fewer."
  source: industry-standard

- term: yarn_twist
  definition: "Number of twists per unit length inserted in a yarn during spinning, expressed as turns per metre (t/m) or turns per inch (t/i); twist level determines yarn strength, softness, and fabric handle."
  category: textile-material
  related_terms: [spinning, ring_frame, yarn_count, twisting]
  examples:
    - "A yarn_twist of 800 t/m is typical for a Nm 40 warp cotton yarn."
  source: industry-standard

- term: short_fibres
  definition: "Fibres below the minimum useful length for long-staple spinning (typically < 25 mm for cotton); removed during combing as noils; excessive short_fibres content reduces yarn strength and increases breaks."
  category: textile-material
  related_terms: [combing, noils, card_sliver, cotton_fibre]
  examples:
    - "Short_fibres content above 15 percent in cotton feed causes excessive breaks during ring spinning."
  source: industry-standard

- term: weave_structure
  definition: "Pattern of interlacing between warp and weft threads that determines the fabric's appearance and properties; basic structures include plain weave, twill, and satin, each requiring a specific number of heald frames."
  category: textile-process
  related_terms: [heald_frame, loom, warp, weft]
  examples:
    - "A 2/1 twill weave_structure requires a minimum of 3 heald frames and produces a diagonal surface effect."
  source: industry-standard

- term: shed
  definition: "Temporary triangular opening formed between raised and lowered warp thread groups by the heald frames, through which the weft insertion device (rapier, shuttle, air jet) passes to insert the weft pick."
  category: textile-process
  related_terms: [heald_frame, heald, warp, loom]
  examples:
    - "A clean, uniform shed is critical for trouble-free weft insertion at 800 picks/min."
  source: industry-standard
