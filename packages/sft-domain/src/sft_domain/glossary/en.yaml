- term: critical_decision
  definition: "Agent action or recommendation that impacts safety, production, or quality in an irreversible or high-cost way; subject to mandatory HITL before execution."
  category: agentic-platform
  related_terms: [hitl, interrupt, audit_trail, supervisor]
  examples:
    - "Generating an urgent maintenance work order on a critical asset is a critical_decision."
