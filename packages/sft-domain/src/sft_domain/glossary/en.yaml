- term: context_window
  definition: "Maximum length (in tokens) that an LLM can process in a single call, including prompt, RAG context, and expected response; Qwen2.5 supports up to 128k tokens."
  category: agentic-platform
  related_terms: [llm, rag, chunk, tool_call]
  examples:
    - "A context_window of 8192 tokens is sufficient to include 5 SOP chunks plus conversation history."
  source: agentic-community

- term: time_series
  definition: "Sequence of observations indexed over time (e.g. spindle vibration every 100 ms, bath temperature every 10 s); a fundamental technique for predictive analytics and anomaly detection in industrial contexts."
  category: agentic-platform
  related_terms: [anomaly_detection, predictive_maintenance, timescaledb, sensor]
  examples:
    - "A 500 Hz vibration time_series across 10 spindles is the basis of the predictive model for bearing replacement."
  source: agentic-community

