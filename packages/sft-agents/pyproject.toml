[project]
name = "sft-agents"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Core SDK: Agent/Tool/Memory/Policy interfaces and LangGraph runtime adapter"
dependencies = [
  "langgraph>=0.4,<0.5",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langchain-core>=1.0,<2.0",
  "langchain-ollama>=0.3,<0.4",
  "langchain-openai>=0.3,<0.4",
  "langfuse>=3,<4",
  "asyncpg>=0.30,<0.31",
  "nats-py>=2.14.0,<3.0",
  "pydantic>=2.9,<3",
  "structlog>=24.4",
  "pyyaml>=6",
  "sft-tools",
  "sft-assets",
  "sft-domain",
  "sft-contracts",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sft_agents"]

[tool.uv.sources]
sft-tools = { workspace = true }
sft-assets = { workspace = true }
sft-domain = { workspace = true }
sft-contracts = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires docker compose / testcontainers",
  "load: long-running load test",
]
