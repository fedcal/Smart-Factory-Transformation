# Asset registry — sft-assets (D-45)
# 30 asset Mantis-realistic: 12 LOOM + 8 SPIN + 4 WARP + 4 DYE + 2 STEN
# Tag dictionary ~50 occorrenze distribuite per 5 famiglie, 24 tag_id distinti
# CRITICAL: SEMPRE yaml.safe_load, MAI yaml.load (T-03-01-yaml)
# Ogni asset_id match pattern ^[A-Z]+-\d{2}$
# Ogni opcua_namespace inizia con urn:mantis: (T-03-01-pydantic)

# ============================================================
# LOOM — 12 telai (weaving-line-1: LOOM-01..08, weaving-line-2: LOOM-09..12)
# Tag per loom: warp_tension, pick_density, creel_speed, broken_pick_count, loom_temperature
# ============================================================

- asset_id: LOOM-01
  asset_family: loom
  line_id: weaving-line-1
  opcua_namespace: "urn:mantis:loom:LOOM-01"
  tags:
    - tag_id: warp_tension
      unit: N
      sample_rate_hz: 10.0
      semantic_type: tension
    - tag_id: pick_density
      unit: picks_per_cm
      sample_rate_hz: 1.0
      semantic_type: density
    - tag_id: creel_speed
      unit: rpm
      sample_rate_hz: 5.0
      semantic_type: speed
    - tag_id: broken_pick_count
      unit: count
      sample_rate_hz: 1.0
      semantic_type: density
    - tag_id: loom_temperature
      unit: degC
      sample_rate_hz: 2.0
      semantic_type: temperature
  status: active

