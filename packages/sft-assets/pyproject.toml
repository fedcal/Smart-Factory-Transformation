[project]
name = "sft-assets"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Asset registry: platform metadata per sim-textile, ot-bridge, agents Phase 4+"
dependencies = [
  "pydantic>=2.13.4",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sft_assets"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
