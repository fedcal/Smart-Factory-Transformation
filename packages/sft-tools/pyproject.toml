[project]
name = "sft-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "LangChain Tools cross-cutting: replay loaders (C-MAPSS, UCI) + TimescaleDB query proxy (D-46, D-47)"
dependencies = [
  "pydantic>=2.13.4",
  "langchain-core>=1.0,<2.0",
  "pandas>=2.2,<3.0",
  "asyncpg>=0.30",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sft_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
