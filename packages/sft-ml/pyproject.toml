[project]
name = "sft-ml"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "ML layer: NASA C-MAPSS RUL pipeline + textile cross-domain feature map (Phase 7 MNT-01)"
dependencies = [
  "scikit-learn>=1.7.0,<1.9.0",
  "joblib>=1.5.0,<2.0.0",
  "pandas>=2.3.0,<3.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sft_ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires committed model artifact",
  "slow: training / full-dataset paths",
]
