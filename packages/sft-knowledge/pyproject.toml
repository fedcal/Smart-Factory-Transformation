[project]
name = "sft-knowledge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Knowledge layer: parsers, chunking, embedding, stores, retrieval, tools, memory (Phase 5)"
dependencies = [
  "pydantic>=2.7",
  "langchain-core>=0.3",
  "python-frontmatter>=1.1",
  "structlog>=24.4",
  "qdrant-client[fastembed]>=1.16",
  "FlagEmbedding>=1.3",
  "llama-index-core>=0.11,<0.15",
  "llama-index-embeddings-huggingface>=0.3",
  "neo4j>=5.24,<7",
  "sft-agents",
  "sft-domain",
  "sft-assets",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sft_knowledge"]

[tool.uv.sources]
sft-agents = { workspace = true }
sft-domain = { workspace = true }
sft-assets = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires docker / testcontainers",
  "gpu: requires CUDA GPU",
]
