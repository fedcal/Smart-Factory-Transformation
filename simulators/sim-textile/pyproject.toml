[project]
name = "sim-textile"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Textile line simulator: loom, spinning, warping machine event generation (Fase 3)"
dependencies = [
  "asyncua>=1.1.8,<2.0",
  "pydantic>=2.13.4",
  "pyyaml>=6.0",
  "structlog>=24",
  "prometheus-client>=0.21",
  "jsonschema>=4.23",
  "sft-assets",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
sim-textile = "sim_textile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_textile"]

[tool.uv.sources]
sft-assets = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
