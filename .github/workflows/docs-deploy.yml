name: Deploy Docs
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write   # needed for gh-deploy / mike push to gh-pages branch

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike needs full history to read gh-pages branch

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install docs dependencies
        # mike==2.2.0 is declared in docs/requirements.txt
        run: pip install -r docs/requirements.txt

      - name: Build site (strict validation)
        # Fail fast if any page has broken links or missing references.
        run: mkdocs build --strict
        working-directory: docs/

      - name: Deploy versioned docs (mike)
        # Deploys to gh-pages using mike versioning:
        #   main  → versione di sviluppo (HEAD di main)
        #   latest → alias che punta alla versione corrente stabile
        # mike deploy --push aggiorna il branch gh-pages direttamente.
        # Note: custom domain (CNAME) è opzionale; configurarlo aggiungendo
        #   --cname <dominio> oppure un file docs/docs/CNAME — non configurato (deferred).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases main latest
          mike set-default --push latest
        working-directory: docs/
