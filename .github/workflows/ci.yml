name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'
      NX_DAEMON: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Critico per nrwl/nx-set-shas (Pitfall 2: storia completa necessaria)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6"
          enable-cache: true

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          # chiave include nx.json + package-lock.json per T-1-04 cache poisoning mitigation
          key: nx-${{ runner.os }}-${{ hashFiles('nx.json', 'package-lock.json') }}
          restore-keys: nx-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Set NX SHAs
        uses: nrwl/nx-set-shas@v4
        with:
          main-branch-name: main
          workflow-id: ci.yml
          # fallback-sha evita il fallimento sul primo commit del repo (Pitfall 2)
          fallback-sha: "HEAD~1"
          # false = non fallire se nessun workflow precedente trovato (repo nuovo / primo run)
          error-on-no-successful-workflow: false

      - name: Validate Nx dependency graph (Python<->TS edges)
        run: |
          mkdir -p tmp
          npx nx graph --file=tmp/graph.json
          python3 scripts/validate-nx-graph.py

      - name: Nx Affected Lint
        run: npx nx affected --target=lint --base=$NX_BASE --head=$NX_HEAD --parallel=3

      - name: Nx Affected Test
        run: npx nx affected --target=test --base=$NX_BASE --head=$NX_HEAD --parallel=3 --configuration=ci

      - name: Nx Affected Build
        run: npx nx affected --target=build --base=$NX_BASE --head=$NX_HEAD --parallel=3
