site_name: Smart Factory Transformation
site_description: Piattaforma opensource agentica per la trasformazione digitale di un'industria tessile manifatturiera
site_url: ""
repo_url: https://github.com/smart-factory-transformation/smart-factory-transformation
repo_name: smart-factory-transformation
edit_uri: edit/main/docs/docs/

docs_dir: docs
site_dir: site
# Local navigability: relative URLs so the built site is browsable directly from
# the filesystem (file://) without a web server, and `mkdocs serve` works offline.
use_directory_urls: false

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  - i18n:
      docs_structure: folder
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
          site_name: Smart Factory Transformation
        - locale: en
          name: English
          build: true
          site_name: Smart Factory Transformation
          nav_translations:
            Architettura: Architecture
            C4 Context: C4 Context
            C4 Container: C4 Container
            C4 Component: C4 Component
            Iniziare: Getting Started
            Contributing: Contributing
            Dominio: Domain
            Indice: Index
            Processi: Processes
            Ruoli: Roles
            Tessitura: Weaving
            Filatura: Spinning
            Orditura: Warping
            Tintoria: Dyeing
            Finissaggio: Finishing
            Operatore: Operator
            Tecnico: Technician
            Caposquadra: Shift Supervisor
            Procedure (SOP): Procedures (SOP)
            Glossario: Glossary
            IT/OT: IT/OT
            Panoramica: Overview
            Schema ingest: Ingest Schema
            Schema OPC-UA: OPC-UA Schema
            Agentic Runtime: Agentic Runtime
            HITL Cycle: HITL Cycle
            Knowledge Layer: Knowledge Layer
            Pipeline di retrieval ibrida: Hybrid retrieval pipeline
            Modello ACL: ACL model
            Risultati A/B BGE-M3 vs multilingual-e5-large: A/B results — BGE-M3 vs multilingual-e5-large
            Agenti: Agents
            Operations: Operations
            Maintenance: Maintenance
            Tassonomia Eventi: Event Taxonomy
            Knowledge: Knowledge
            Knowledge Cluster: Knowledge Cluster
            Supply Chain: Supply Chain
            Supply Cluster: Supply Cluster
            Mantis Synthetic Dataset: Mantis Synthetic Dataset
            Interfaccia Utente: User Interface
            Mock UI: Mock UI
            Analisi Funzionale: Functional Analysis
            Workflow Operations: Operations Workflow
            Workflow Maintenance: Maintenance Workflow
            Workflow Training: Training Workflow
            Casi d'Uso: Use Cases
            Roadmap di Adozione: Adoption Roadmap
            Analisi Economica: Economic Analysis
            TCO: TCO
            OEPV: OEPV
            Value Driver: Value Drivers
            Sicurezza & Governance: Security & Governance
            STRIDE Threat Model: STRIDE Threat Model
            OWASP LLM: OWASP LLM
            ADR: ADR
            Trasformazione: Transformation
      reconfigure_material: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - assets/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/smart-factory-transformation/smart-factory-transformation

