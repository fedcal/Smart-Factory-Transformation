site_name: Smart Factory Transformation
site_description: Piattaforma opensource agentica per la trasformazione digitale di un'industria tessile manifatturiera
site_url: https://fedcal.github.io/Smart-Factory-Transformation/
repo_url: https://github.com/fedcal/Smart-Factory-Transformation
repo_name: fedcal/Smart-Factory-Transformation
edit_uri: edit/main/docs/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - tags
  - i18n:
      docs_structure: folder
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
          site_name: Smart Factory Transformation
        - locale: en
          name: English
          build: true
          site_name: Smart Factory Transformation
          nav_translations:
            Architettura: Architecture
            Iniziare: Getting Started
            Contributing: Contributing
            Dominio: Domain
            Indice: Index
            Processi: Processes
            Ruoli: Roles
            Tessitura: Weaving
            Filatura: Spinning
            Orditura: Warping
            Tintoria: Dyeing
            Finissaggio: Finishing
            Operatore: Operator
            Tecnico: Technician
            Caposquadra: Shift Supervisor
            Procedure (SOP): Procedures (SOP)
            Glossario: Glossary
            IT/OT: IT/OT
            Panoramica: Overview
            Schema ingest: Ingest Schema
            Schema OPC-UA: OPC-UA Schema
            Agentic Runtime: Agentic Runtime
            HITL Cycle: HITL Cycle
            Knowledge Layer: Knowledge Layer
            Architettura: Architecture
            Pipeline di retrieval ibrida: Hybrid retrieval pipeline
            Modello ACL: ACL model
            Risultati A/B BGE-M3 vs multilingual-e5-large: A/B results — BGE-M3 vs multilingual-e5-large
            Agenti: Agents
            Operations: Operations
      reconfigure_material: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true

extra_css:
  - assets/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fedcal/Smart-Factory-Transformation

nav:
  - Home: index.md
  - Iniziare: getting-started.md
  - Architettura:
    - Overview: architecture/overview.md
    - LLM Serving: architecture/llm-serving.md
    - Agentic Runtime: architecture/agentic-runtime.md
    - HITL Cycle: architecture/hitl-cycle.md
  - Dominio:
    - Indice: domain/index.md
    - Processi:
      - Tessitura: domain/processes/weaving.md
      - Filatura: domain/processes/spinning.md
      - Orditura: domain/processes/warping.md
      - Tintoria: domain/processes/dyeing.md
      - Finissaggio: domain/processes/finishing.md
    - Ruoli:
      - Operatore: domain/roles/operator.md
      - Tecnico: domain/roles/technician.md
      - Quality Manager: domain/roles/quality-manager.md
      - Caposquadra: domain/roles/shift-supervisor.md
  - Procedure (SOP): sop/index.md
  - Assumption Register: assumptions/index.md
  - Glossario: glossary.md
  - IT/OT:
    - Panoramica: it-ot/index.md
    - Schema ingest: it-ot/ingest-schema.md
    - Schema OPC-UA: it-ot/opcua-schema.md
  - Knowledge Layer:
    - Architettura: knowledge-layer/architecture.md
    - Pipeline di retrieval ibrida: knowledge-layer/retrieval-pipeline.md
    - Modello ACL: knowledge-layer/acl-model.md
    - Risultati A/B BGE-M3 vs multilingual-e5-large: knowledge-layer/eval-results.md
  - Agenti:
    - Operations:
      - OperatorAssistant: agents/operations/operator-assistant.md
      - ProductionPlanner: agents/operations/production-planner.md
      - QualityInspector: agents/operations/quality-inspector.md
      - AnomalyDetector: agents/operations/anomaly-detector.md
  - Contributing: contributing/index.md
