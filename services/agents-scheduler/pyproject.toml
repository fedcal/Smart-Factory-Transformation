[project]
name = "svc-agents-scheduler"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Cron-like APScheduler container that triggers AnomalyDetector every 5 min (D-AD-04, OPS-04)."
dependencies = [
  "APScheduler>=3.10.4,<4",
  "httpx>=0.28",
  "structlog>=24.4",
  "typer>=0.12",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
agents-scheduler = "svc_agents_scheduler.__main__:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_agents_scheduler"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
]
