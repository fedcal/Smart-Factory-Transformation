[project]
name = "svc-ot-bridge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "OT Bridge: unidirectional data-diode from OPC-UA/PLC simulator to NATS JetStream"
dependencies = [
  "asyncua>=1.1.8,<2.0",
  "nats-py>=2.14.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "pydantic>=2.13.4",
  "structlog>=25.5",
  "prometheus-client>=0.21",
  "sft-assets",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "testcontainers>=4.14",
]

[project.scripts]
ot-bridge = "svc_ot_bridge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_ot_bridge"]

[tool.uv.sources]
sft-assets = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
