[project]
name = "svc-knowledge-ingest"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "CLI ingest pipeline: parse → chunk → embed → upsert Qdrant + Neo4j MERGE (Phase 5)"
dependencies = [
  "asyncpg>=0.29",
  "typer>=0.12",
  "structlog>=24.4",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres]>=4.14",
]

[project.scripts]
# Plan 05-10 will create __main__.py and the `app` Typer instance; declaring the
# script here in Plan 05-06 is intentional so the Nx target wiring is already
# in place and downstream tooling can resolve the entrypoint.
knowledge-ingest = "svc_knowledge_ingest.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_knowledge_ingest"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires testcontainers Qdrant+Neo4j+PG",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
]
