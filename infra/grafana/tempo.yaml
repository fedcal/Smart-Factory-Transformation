# Tempo configuration for Smart Factory Transformation dev stack.
# Phase 11 — Plan 11-00, OBS-03.
#
# Config minimale: receiver OTLP (gRPC + HTTP) + storage locale in-process.
# Per produzione: usare object storage S3/GCS e replicazione.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: sft-dev
  storage:
    path: /var/tempo/generator/wal

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s
