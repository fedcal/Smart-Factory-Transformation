# Smart Factory Transformation — LLM CPU Overlay
# Variante CPU-only (default): funziona su qualsiasi macchina
# Uso: make up (incluso di default)
# Alternativa GPU: make up-gpu (usa llm-gpu.yml invece di questo file)
# Decisione: D-08 (overlay LLM mutualmente esclusivi CPU/GPU)

services:
  ollama:
    image: ollama/ollama:0.6.0
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "2"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  ollama-models:
