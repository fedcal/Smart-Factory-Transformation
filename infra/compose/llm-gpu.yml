# Smart Factory Transformation — LLM GPU Overlay
# Use: make up-gpu — richiede NVIDIA Container Toolkit installato
# Prerequisito: nvidia-smi disponibile sull'host; nvidia-container-toolkit installato
# Verifica: nvidia-smi && docker run --rm --gpus all nvidia/cuda:12.0-base nvidia-smi
# Decisione: D-08 (overlay LLM mutualmente esclusivi CPU/GPU)

services:
  ollama:
    image: ollama/ollama:0.6.0
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "2"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  ollama-models:
