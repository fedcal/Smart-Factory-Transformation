# Smart Factory Transformation — Core Dev Stack
# Servizi core: Postgres+TimescaleDB, Redis, Qdrant
# Decisioni: D-07 (split per area), D-09 (named volumes), D-10 (healthchecks)
# NON usare in produzione: secrets gestiti via SealedSecrets (plan 06)

services:
  postgres:
    image: timescale/timescaledb:2.18.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sft_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sft}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sft}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sft-core
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - sft-core
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.16.1
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sft-core
    restart: unless-stopped

  # Phase 5 Plan 05-05: Neo4j 5.24 Community per knowledge graph (KNW-08).
  # APOC plugin abilitato per export/import e procedure avanzate (uso futuro).
  # Auth dev-only: NEO4J_AUTH override via env in production (SealedSecret Helm).
  # Browser HTTP 7474 esposto solo in dev — Phase 11 NetworkPolicy in prod.
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/devpassword}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j-data:/data
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 | grep -q Neo4j"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sft-core
    restart: unless-stopped

  # Phase 4 Plan 04-07: FastAPI HITL REST surface. Joins sft-core only —
  # NEVER reaches sft-ot per Phase 3 D-51 data-diode. NATS lives in sim.yml
  # on the sft-core network; load both files to wire end-to-end:
  #     docker compose -f infra/compose/core.yml -f infra/compose/sim.yml up
  api-gateway:
    build:
      context: ../..
      dockerfile: apps/api-gateway/Dockerfile
    image: sft-api-gateway:dev
    # No container_name — allows COMPOSE_PROJECT_NAME-based isolation so
    # multiple compose projects (e.g. parallel E2E test runs) can coexist
    # without colliding on a fixed container name (OQ8 fix).
    environment:
      TIMESCALE_DSN: "postgresql://${POSTGRES_USER:-sft}:${POSTGRES_PASSWORD:-sft_dev_pass}@postgres:5432/${POSTGRES_DB:-sft}"
      NATS_URL: "nats://nats:4222"
      API_GATEWAY_PORT: "8081"
      POOL_MIN_SIZE: "5"
      POOL_MAX_SIZE: "20"
    ports:
      - "${API_GATEWAY_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; r=urllib.request.urlopen(\"http://localhost:8081/v1/health\", timeout=3); sys.exit(0 if r.getcode()==200 else 1)'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sft-core
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  qdrant-data:
  neo4j-data:

networks:
  sft-core:
    driver: bridge
