# SealedSecrets Example Template
# ============================================================
# QUESTO FILE E' UN PATTERN DI RIFERIMENTO — NON E' ATTIVO DI DEFAULT.
#
# Per usarlo:
# 1. Installare il controller SealedSecrets nel cluster (UNA VOLTA):
#    helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#    helm install sealed-secrets-controller sealed-secrets/sealed-secrets \
#      --namespace kube-system --wait
#
# 2. Ottenere la chiave pubblica del cluster:
#    kubeseal --fetch-cert > infra/helm/sealed-secrets-pub-key.pem
#
# 3. Cifrare un secret (esempio: credenziali PostgreSQL):
#    kubectl create secret generic postgresql-credentials \
#      --from-literal=postgres-password=SUPER_SECRET_PASSWORD \
#      --dry-run=client -o yaml \
#    | kubeseal --format yaml \
#        --cert infra/helm/sealed-secrets-pub-key.pem \
#    > infra/helm/sft-stack/templates/sealed-postgresql-credentials.yaml
#
# 4. Committare il file .yaml cifrato (sicuro: solo il controller del cluster
#    possiede la chiave privata per decifrarlo).
#
# Documentazione completa: docs/operations/sealed-secrets.md
# ============================================================

{{- if .Values.sealedSecrets }}
{{- if .Values.sealedSecrets.postgresCredentials }}
---
# SealedSecret per credenziali PostgreSQL
# Generato con: kubectl create secret generic postgresql-credentials ...
# | kubeseal --format yaml --cert infra/helm/sealed-secrets-pub-key.pem
# NOTA: il valore encryptedData qui sotto e' un PLACEHOLDER — sostituire con output kubeseal reale
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgresql-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sft-stack.labels" . | nindent 4 }}
spec:
  encryptedData:
    postgres-password: {{ .Values.sealedSecrets.postgresCredentials.encryptedPassword | quote }}
  template:
    metadata:
      name: postgresql-credentials
      namespace: {{ .Release.Namespace }}
    type: Opaque
{{- end }}
{{- end }}
