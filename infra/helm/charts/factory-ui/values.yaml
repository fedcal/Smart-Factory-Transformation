# Smart Factory Transformation — factory-ui chart values
# Frontend Angular SSR. Porta 4000 (SSR dev server / Node SSR).

replicaCount: 1

image:
  repository: ghcr.io/smart-factory-transformation/sft-factory-ui
  pullPolicy: IfNotPresent
  # Tag vuoto = usa Chart.yaml appVersion. In produzione impostare tag esplicito (no latest).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

# PodSecurityContext (T-1-04: EoP prevenzione, D-17)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 4000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true

nodeSelector: {}

tolerations: []

affinity: {}
