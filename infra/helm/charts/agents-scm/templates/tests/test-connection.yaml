apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "agents-scm.fullname" . }}-test-connection"
  labels:
    {{- include "agents-scm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      command: ['wget']
      args:
        - '--spider'
        - '--timeout=10'
        - 'http://{{ include "agents-scm.fullname" . }}:{{ .Values.service.port }}/health'
