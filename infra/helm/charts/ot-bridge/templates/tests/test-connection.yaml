apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "ot-bridge.fullname" . }}-test-connection"
  labels:
    {{- include "ot-bridge.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: nc
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
      command: ['sh', '-c']
      args:
        - 'nc -z -w 5 {{ include "ot-bridge.fullname" . }} {{ .Values.service.port }} && echo "ot-bridge OPC-UA port reachable"'
