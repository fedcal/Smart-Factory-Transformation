[project]
name = "scm-cost-analyzer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Supply chain agent: cost breakdown analysis and savings identification"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scm_cost_analyzer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
