[project]
name = "ops-anomaly-detector"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Operations agent: anomaly detection on sensor streams"
dependencies = [
  "asyncpg>=0.30,<0.31",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "structlog>=24.4",
  "sft-agents",
  "sft-assets",
  "sft-domain",
  "sft-tools",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_anomaly_detector"]

[tool.uv.sources]
sft-agents = { workspace = true }
sft-assets = { workspace = true }
sft-domain = { workspace = true }
sft-tools = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires docker compose / testcontainers",
]
