[project]
name = "ops-quality-inspector"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Operations agent: quality control signal analysis and defect reporting"
dependencies = [
  "sft-agents",
  "sft-domain",
  "sft-knowledge",
  "sft-tools",
  "nats-py>=2.14",
  "asyncpg>=0.29",
  "structlog>=24.4",
  "langchain-core>=0.3",
  "pydantic>=2.7",
  "pyyaml>=6.0,<7",
]

[tool.uv.sources]
sft-agents = { workspace = true }
sft-domain = { workspace = true }
sft-knowledge = { workspace = true }
sft-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_quality_inspector"]
