[project]
name = "ops-production-planner"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Operations agent: production planning and scheduling optimization (D-PP-01..04)"
dependencies = [
  "pydantic>=2.9,<3",
  "structlog>=24.4",
  "langchain-core>=1.0,<2.0",
  "sft-agents",
  "sft-domain",
  "sft-knowledge",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_production_planner"]

[tool.uv.sources]
sft-agents = { workspace = true }
sft-domain = { workspace = true }
sft-knowledge = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
