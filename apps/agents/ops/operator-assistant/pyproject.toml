[project]
name = "ops-operator-assistant"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Operations agent: real-time operator decision support on the factory floor"
dependencies = [
  "sft-agents",
  "sft-domain",
  "sft-knowledge",
  "sft-tools",
  "asyncpg>=0.29",
  "structlog>=24.4",
  "langchain-core>=0.3",
  "langgraph>=0.4,<0.5",
  # Pin langgraph-prebuilt to the 0.x line: prebuilt 1.x requires langgraph>=1.0
  # (it imports langgraph.stream which doesn't exist on 0.4.x). uv otherwise picks
  # the latest 1.1.0 which breaks `from langgraph.prebuilt import create_react_agent`.
  "langgraph-prebuilt>=0.2,<1.0",
  "pydantic>=2.7",
  "langdetect>=1.0.9",
]

[tool.uv.sources]
sft-agents = { workspace = true }
sft-domain = { workspace = true }
sft-knowledge = { workspace = true }
sft-tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_operator_assistant"]
