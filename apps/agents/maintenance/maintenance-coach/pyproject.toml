[project]
name = "mnt-maintenance-coach"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Maintenance agent: guided maintenance procedure coach for technicians"
dependencies = [
  "sft-agents",
  "sft-knowledge",
  "sft-domain",
  "langgraph>=0.4,<0.6",
  "langgraph-checkpoint-postgres>=3.1.0,<4.0.0",
  "langchain-core>=0.3",
  "pydantic>=2.7.0,<3.0.0",
  "asyncpg>=0.29",
  "structlog>=24.4",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "testcontainers[postgres]>=4.8.0,<5.0.0",
]

[tool.uv.sources]
sft-agents = { workspace = true }
sft-domain = { workspace = true }
sft-knowledge = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mnt_maintenance_coach"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: marks tests requiring docker / testcontainers",
  "testcontainers: marks tests using testcontainers",
]
