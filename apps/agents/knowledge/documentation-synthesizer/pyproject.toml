[project]
name = "trn-documentation-synthesizer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Knowledge agent: synthesizes technical documentation from unstructured sources"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trn_documentation_synthesizer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
