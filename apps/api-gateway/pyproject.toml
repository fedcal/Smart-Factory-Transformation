[project]
name = "svc-api-gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "FastAPI API gateway: REST + WebSocket bridge to the agent cluster (Phase 4 Plan 04-07)"
dependencies = [
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.32",
  "langchain-core>=1.0,<2.0",
  "langgraph>=0.4,<0.5",
  "asyncpg>=0.30,<0.31",
  # langgraph-checkpoint-postgres requires psycopg3 with a libpq backend; the
  # binary wheel ships the C extension so the slim Docker image works without
  # an apt-installed libpq-dev. Rule 3 fix during E2E run (Plan 04-07 Task 3).
  "psycopg[binary]>=3.1,<4",
  "nats-py>=2.14.0,<3.0",
  "pydantic>=2.9,<3",
  "structlog>=24.4",
  "httpx>=0.28",
  "pyyaml>=6",
  "sft-agents",
  "mnt-predictive-maintenance",
  "mnt-maintenance-coach",
  "mnt-downtime-analyzer",
  # Phase 8 knowledge agents (Plan 08-08 — D-X-04)
  "trn-shift-handover",
  "trn-training-coach",
  "trn-knowledge-curator",
  "trn-documentation-synthesizer",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "testcontainers[postgres]>=4.14",
]

[project.scripts]
api-gateway = "svc_api_gateway.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svc_api_gateway"]

[tool.uv.sources]
sft-agents = { workspace = true }
mnt-predictive-maintenance = { workspace = true }
mnt-maintenance-coach = { workspace = true }
mnt-downtime-analyzer = { workspace = true }
trn-shift-handover = { workspace = true }
trn-training-coach = { workspace = true }
trn-knowledge-curator = { workspace = true }
trn-documentation-synthesizer = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires PG+NATS testcontainers",
  "e2e: full stack via docker compose",
]
